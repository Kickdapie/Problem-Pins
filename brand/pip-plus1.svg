<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none"><style>.pip-pivot,.pip-eyes,.pip-shadow,.pip-badge,.pip-glyph{transform-box:fill-box;transform-origin:50% 50%}.pip-pivot{transform-origin:50% 100%}.pip-blink{animation:pip-blink 5.2s infinite}.pip-sway{animation:pip-sway 3.6s ease-in-out infinite alternate}.pip-sigh{animation:pip-sigh 4.4s ease-in-out infinite alternate}.pip-hop{animation:pip-hop 2.8s cubic-bezier(.3,0,.3,1) infinite}.pip-hop-shadow{animation:pip-hop-shadow 2.8s cubic-bezier(.3,0,.3,1) infinite}.pip-pop{animation:pip-pop .5s cubic-bezier(.3,1.5,.5,1) .25s both}.pip-seek{animation:pip-seek 3.2s ease-in-out infinite}.pip-flip{animation:pip-flip 5s ease-in-out infinite}.pip-drop{animation:pip-drop .5s cubic-bezier(.3,0,.3,1) both}@keyframes pip-blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes pip-sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}@keyframes pip-sigh{from{transform:scale(1)}to{transform:scale(1.03,.96)}}@keyframes pip-hop{0%,50%,100%{transform:translateY(var(--lift))}10%{transform:translateY(var(--lift)) scale(1.06,.92)}28%{transform:translateY(0) scale(.97,1.03)}42%{transform:translateY(var(--lift)) scale(1.05,.94)}}@keyframes pip-hop-shadow{0%,10%,42%,100%{transform:scaleX(1.45)}28%{transform:scaleX(1)}}@keyframes pip-pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes pip-seek{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(0,4px)}75%{transform:translate(3px,2px)}}@keyframes pip-flip{0%,80%{transform:rotate(0)}100%{transform:rotate(180deg)}}@keyframes pip-drop{0%{transform:translateY(-70px);opacity:0}55%{transform:translateY(0);opacity:1}72%{transform:scale(1.08,.9)}100%{transform:none}}@media (prefers-reduced-motion:reduce){[class*="pip-"]{animation:none!important}}</style><ellipse class="pip-shadow pip-hop-shadow" cx="70" cy="137" rx="11" ry="3.08" fill="#141b2d" opacity=".14"/><g transform="translate(70 54) rotate(-5 0 66)"><g class="pip-pivot pip-hop" style="--lift:8px"><path d="M0 66C-10 52-40 27-40 0a40 40 0 1 1 80 0C40 27 10 52 0 66Z" fill="#ef5a1f" stroke="#ef5a1f" stroke-width="8" stroke-linejoin="round"/><g class="pip-eyes pip-blink" style="animation-delay:-0.9s"><ellipse cx="-11" cy="2" rx="6.5" ry="10.26" fill="#141b2d"/></g><g class="pip-eyes pip-blink" style="animation-delay:-0.9s"><ellipse cx="17" cy="2" rx="6.5" ry="10.26" fill="#141b2d"/></g></g></g><g class="pip-badge pip-pop"><g class="pip-badge "><circle cx="118" cy="32" r="19" fill="#141b2d" stroke="#fff" stroke-width="4"/><g class="pip-glyph "><path transform="translate(107.8 21.8) scale(0.85)" d="M4.5 12h8M8.5 8v8M16 9.3l3-2.3v10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg>
