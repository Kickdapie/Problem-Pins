<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none"><style>.pip-pivot,.pip-eyes,.pip-shadow,.pip-badge,.pip-glyph{transform-box:fill-box;transform-origin:50% 50%}.pip-pivot{transform-origin:50% 100%}.pip-blink{animation:pip-blink 5.2s infinite}.pip-sway{animation:pip-sway 3.6s ease-in-out infinite alternate}.pip-sigh{animation:pip-sigh 4.4s ease-in-out infinite alternate}.pip-hop{animation:pip-hop 2.8s cubic-bezier(.3,0,.3,1) infinite}.pip-hop-shadow{animation:pip-hop-shadow 2.8s cubic-bezier(.3,0,.3,1) infinite}.pip-pop{animation:pip-pop .5s cubic-bezier(.3,1.5,.5,1) .25s both}.pip-seek{animation:pip-seek 3.2s ease-in-out infinite}.pip-flip{animation:pip-flip 5s ease-in-out infinite}.pip-drop{animation:pip-drop .5s cubic-bezier(.3,0,.3,1) both}@keyframes pip-blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes pip-sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}@keyframes pip-sigh{from{transform:scale(1)}to{transform:scale(1.03,.96)}}@keyframes pip-hop{0%,50%,100%{transform:translateY(var(--lift))}10%{transform:translateY(var(--lift)) scale(1.06,.92)}28%{transform:translateY(0) scale(.97,1.03)}42%{transform:translateY(var(--lift)) scale(1.05,.94)}}@keyframes pip-hop-shadow{0%,10%,42%,100%{transform:scaleX(1.45)}28%{transform:scaleX(1)}}@keyframes pip-pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes pip-seek{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(0,4px)}75%{transform:translate(3px,2px)}}@keyframes pip-flip{0%,80%{transform:rotate(0)}100%{transform:rotate(180deg)}}@keyframes pip-drop{0%{transform:translateY(-70px);opacity:0}55%{transform:translateY(0);opacity:1}72%{transform:scale(1.08,.9)}100%{transform:none}}@media (prefers-reduced-motion:reduce){[class*="pip-"]{animation:none!important}}</style><ellipse class="pip-shadow" cx="70" cy="137" rx="16" ry="4.48" fill="#141b2d" opacity=".14"/><g transform="translate(70 62) rotate(-8 0 66) translate(0 66) scale(1.05 0.94) translate(0 -66)"><g class="pip-pivot pip-sigh" style="--lift:0px"><path d="M0 66C-10 52-40 27-40 0a40 40 0 1 1 80 0C40 27 10 52 0 66Z" fill="#ef5a1f" stroke="#ef5a1f" stroke-width="8" stroke-linejoin="round"/><g class="pip-eyes pip-blink" style="animation-delay:-3.6s"><g transform="rotate(-9 -14 11)"><path d="M-20.5 11a6.5 7 0 0 0 13 0Z" fill="#141b2d"/><path d="M-21.5 11h15" stroke="#141b2d" stroke-width="3.2" stroke-linecap="round"/></g></g><g class="pip-eyes pip-blink" style="animation-delay:-3.6s"><g transform="rotate(9 14 11)"><path d="M7.5 11a6.5 7 0 0 0 13 0Z" fill="#141b2d"/><path d="M6.5 11h15" stroke="#141b2d" stroke-width="3.2" stroke-linecap="round"/></g></g></g></g><g class="pip-badge pip-pop"><g class="pip-badge "><circle cx="118" cy="32" r="19" fill="#8e63c7" stroke="#fff" stroke-width="4"/><g class="pip-glyph pip-flip"><path transform="translate(107.8 21.8) scale(0.85)" d="M6 3h12M6 21h12M7.5 3v3.5L12 12l4.5-5.5V3M7.5 21v-3.5L12 12l4.5 5.5V21" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg>
